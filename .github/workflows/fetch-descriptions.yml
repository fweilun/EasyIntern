name: Fetch job descriptions

on:
  schedule:
    # once a day -- unlike the 30-min alert poll, this hits many external
    # company career pages and doesn't need to be instant.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cs-job-alert-descriptions
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new job descriptions
        run: python fetch_descriptions.py

      - name: Commit updated descriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/descriptions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update fetched job descriptions"
            git pull --rebase --autostash origin main
            git push
          fi
